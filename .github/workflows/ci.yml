name: CI Test Suite & Correctness Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Node ${{ matrix.node-version }} on Ubuntu
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite with native coverage
        run: node --test --experimental-test-coverage test/**/*.test.js
        env:
          NODE_ENV: test
          DASHBOARD_API_KEY: ci_test_dashboard_key_secret_123
          OPENROUTER_API_KEY: mock_ci_openrouter_key
          META_WEBHOOK_VERIFY_TOKEN: ci_verify_token

      - name: Run database backup verification
        run: npm run backup
        env:
          NODE_ENV: test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
