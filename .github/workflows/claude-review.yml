# Automatic PR review by Claude (see docs/TEAM.md, "Automatic PR review").
# Runs only when a PR is opened, reopened, marked ready, or labelled "claude-review":
# nothing runs (or costs) while no PR changes. Pushes don't re-run it; add the label to re-review.
# Uses the review steps in .claude/skills/pr-review/SKILL.md and posts one comment.
# Needs the Claude GitHub App and the CLAUDE_CODE_OAUTH_TOKEN secret; without the secret it skips.
name: Claude review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      !github.event.pull_request.draft &&
      (github.event.action != 'labeled' || github.event.label.name == 'claude-review')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Skip without the Claude token
        if: env.HAS_TOKEN != 'true'
        run: echo "CLAUDE_CODE_OAUTH_TOKEN is not set; skipping the review."
      - uses: actions/checkout@v6
        if: env.HAS_TOKEN == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/pr-review ${{ github.event.pull_request.number }}"
          claude_args: |
            --model sonnet
            --max-turns 25
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Read,Grep,Glob,Write"
