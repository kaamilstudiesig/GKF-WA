services:
  - type: web
    name: gkf-wa
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Pin Node 22 — the app uses node:sqlite which breaks on older Node.
      # (Alternatively add "engines": {"node": ">=22"} to package.json.)
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Secrets below are set in the Render dashboard (never committed).
      - key: DASHBOARD_API_KEY
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
